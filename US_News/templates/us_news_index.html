<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-token" content="{{ api_token }}">
    <title>SHM Ventures</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('us_news.static', filename='style.css') }}?v={{ now }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header-container">
            <nav class="nav">
                <div class="nav-brand">
                    <h1>SHM Ventures</h1>
                </div>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <div class="theme-toggle-wrapper">
                        <input type="checkbox" class="theme-checkbox" id="themeToggle">
                        <label for="themeToggle" class="theme-label">
                            <span class="moon">🌙</span>
                            <span class="sun">☀️</span>
                            <span class="ball"></span>
                        </label>
                    </div>
                    <button id="refreshBtn" class="refresh-btn" title="Update all news">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </nav>
        </header>

        <div class="content-wrapper">
            <!-- Ticker List Sidebar -->
            <div class="ticker-sidebar">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input type="text" id="tickerSearch" placeholder="Search ticker..." maxlength="20"
                            autocomplete="off">
                        <div id="searchDropdown" class="search-dropdown"></div>
                    </div>
                </div>
                <div class="ticker-list" id="tickerList">
                    {% for ticker in tickers %}
                    <div class="ticker-item" data-ticker="{{ ticker }}">
                        {{ ticker }}
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Summary Display Area -->
            <div class="summary-section">
                <div class="header-container-mobile">
                    <h1 class="title">Top 50 Stock News</h1>
                </div>

                <div id="summaryContent" class="summary-content">
                    <div class="placeholder">
                        <div class="glass-card">
                            <div class="glass-icon">
                                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 3v18h18" />
                                    <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" />
                                </svg>
                            </div>
                            <h2 class="glass-title">Market Intelligence</h2>
                            <p class="glass-subtitle">Select a ticker from the sidebar to view<br>real-time AI generated
                                summaries.</p>
                        </div>
                    </div>
                </div>
                <footer class="app-footer glass-footer">
                    <div class="app-footer-content">
                        <div class="footer-left">
                            <span>&copy; 2025 SHM Ventures. All rights reserved.</span>
                        </div>
                        <div class="footer-links">
                            <a href="#">Privacy Policy</a>
                            <a href="#">Terms of Service</a>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script src="{{ url_for('us_news.static', filename='script.js') }}"></script>
    <link rel="stylesheet" href="/css/chatbot.css">
    <script src="/js/chatbot.js" defer></script>
</body>

</html>
