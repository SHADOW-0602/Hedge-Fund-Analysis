<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Sign In - Portfolio Analysis Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/modern-styles.css">
    <script>
        if (!window.API_BASE) {
            window.API_BASE = window.location.origin;
        }
    </script>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Header -->
        <div class="text-center mt-10 mb-16">
            <div
                class="w-16 h-16 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">SV</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">SHM Ventures</h1>
            <p class="text-gray-600 mt-2">Professional-grade portfolio/transaction management platform</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-white rounded-xl shadow-lg p-8">
            <!-- Tab Buttons -->
            <div class="flex space-x-4 mb-6">
                <button class="tab-active px-6 py-3 rounded-lg font-semibold transition-all flex-1"
                    onclick="showAuthTab('login')" id="loginTabBtn">Sign In</button>
                <button
                    class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-all flex-1"
                    onclick="showAuthTab('register')" id="registerTabBtn">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="loginTab" class="auth-tab">
                <!-- Google Sign In Button -->
                <button type="button" onclick="handleGoogleLogin()"
                    class="w-full bg-white text-gray-700 font-semibold py-3 px-4 border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 mb-6">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google logo">
                    Sign in with Google
                </button>

                <div class="relative mb-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="loginUsername" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password <span
                                class="text-red-500">*</span></label>
                        <input type="password" id="loginPassword" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-sm">
                            <a href="#" onclick="showAuthTab('forgotPassword'); return false;"
                                class="font-medium text-indigo-600 hover:text-indigo-500">Forgot your password?</a>
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">Sign
                        In</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerTab" class="auth-tab hidden">
                <!-- Google Sign Up Button -->
                <button type="button" onclick="handleGoogleLogin()"
                    class="w-full bg-white text-gray-700 font-semibold py-3 px-4 border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 mb-6">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google logo">
                    Sign up with Google
                </button>

                <div class="relative mb-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="registerUsername" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email <span
                                class="text-red-500">*</span></label>
                        <input type="email" id="registerEmail" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                        <div class="flex relative">
                            <!-- Custom Country Selector -->
                            <div class="relative">
                                <input type="hidden" id="countryCode" value="+91">
                                <button type="button" id="countryDropdownBtn"
                                    class="w-28 px-2 py-3 border border-r-0 border-gray-300 rounded-l-lg focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-sm flex items-center justify-between hover:bg-gray-100 transition-colors">
                                    <span id="selectedCountry" class="truncate">🇮🇳 +91</span>
                                    <svg class="w-4 h-4 text-gray-500 ml-1" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div id="countryDropdownMenu"
                                    class="hidden absolute top-full left-0 w-[calc(100vw-4rem)] sm:w-80 bg-white border border-gray-200 rounded-lg shadow-xl z-50 mt-1 max-h-64 flex flex-col transform transition-all origin-top-left mx-2 sm:mx-0">
                                    <div class="p-2 border-b border-gray-100 sticky top-0 bg-white rounded-t-lg">
                                        <input type="text" id="countrySearch" placeholder="Search (e.g. 91 or US)..."
                                            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-indigo-500">
                                    </div>
                                    <div id="countryList" class="overflow-y-auto flex-1 p-1">
                                        <!-- Items populated via JS -->
                                    </div>
                                </div>
                            </div>

                            <input type="tel" id="registerPhone" placeholder="9876543210"
                                class="flex-1 px-4 py-3 border border-gray-300 rounded-r-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent min-w-0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password <span
                                class="text-red-500">*</span></label>
                        <input type="password" id="registerPassword" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">

                        <!-- Password Strength Meter -->
                        <div id="passwordStrength" class="hidden mt-2 transition-all duration-300">
                            <div class="flex gap-1 h-1.5 mb-2">
                                <div class="strength-bar flex-1 rounded-full bg-gray-200 transition-all duration-300">
                                </div>
                                <div class="strength-bar flex-1 rounded-full bg-gray-200 transition-all duration-300">
                                </div>
                                <div class="strength-bar flex-1 rounded-full bg-gray-200 transition-all duration-300">
                                </div>
                                <div class="strength-bar flex-1 rounded-full bg-gray-200 transition-all duration-300">
                                </div>
                            </div>
                            <p id="passwordFeedback" class="text-xs text-gray-500"></p>
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">Create
                        Account</button>
                </form>
            </div>

            <!-- Forgot Password Tab (Initially Hidden) -->
            <div id="forgotPasswordTab" class="auth-tab hidden">
                <div class="mb-6 text-center">
                    <h3 class="text-xl font-bold text-gray-900">Reset Password</h3>
                    <p class="text-sm text-gray-600">Enter your email to receive a verification code</p>
                </div>

                <!-- Step 1: Request OTP -->
                <form id="forgotPasswordRequestForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email or Username</label>
                        <input type="text" id="forgotEmail" required placeholder="Enter your email or username"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">Send
                        Code</button>
                    <div class="text-center mt-4">
                        <button type="button" onclick="showAuthTab('login')"
                            class="text-sm text-indigo-600 hover:text-indigo-800">Back to Sign In</button>
                    </div>
                </form>

                <!-- Step 2: Confirm OTP (Hidden) -->
                <form id="forgotPasswordConfirmForm" class="space-y-4 hidden">
                    <div class="bg-blue-50 p-4 rounded-lg mb-4">
                        <p class="text-sm text-blue-800">Code sent! Check your email inbox.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Verification Code</label>
                        <input type="text" id="forgotOtp" required placeholder="6-digit code"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent tracking-widest text-center text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                        <input type="password" id="forgotNewPassword" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <button type="submit"
                        class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-semibold">Reset
                        Password</button>
                    <div class="text-center mt-4">
                        <button type="button" onclick="showAuthTab('login')"
                            class="text-sm text-indigo-600 hover:text-indigo-800">Back to Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <script src="utils.js?v=3&t=1730400000"></script>
    <script src="auth.js?v=3&t=1730400000"></script>
</body>

</html>
