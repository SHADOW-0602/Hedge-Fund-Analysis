<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Admin Portal - Portfolio Analysis Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/modern-styles.css">
</head>

<body class="gradient-bg min-h-screen">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-lg border-b-4 border-indigo-600">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-6" style="flex-direction: row !important;">
                    <div class="flex items-center" style="flex-direction: row !important;">
                        <div class="flex items-center cursor-pointer whitespace-nowrap" onclick="goToMainApp()">
                            <div
                                class="w-10 h-10 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center mr-3">
                                <span class="text-white font-bold text-lg">SV</span>
                            </div>
                            <h1
                                class="text-xl md:text-3xl font-bold text-gray-900 hover:text-indigo-600 transition-colors truncate">
                                SHM Ventures</h1>
                        </div>
                    </div>

                    <div class="flex items-center space-x-4">
                        <!-- Mobile Menu Button -->
                        <div class="md:hidden">
                            <button id="adminMobileMenuBtn" onclick="toggleAdminMobileMenu()"
                                class="text-gray-600 hover:text-gray-900 focus:outline-none p-2 rounded-md">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>
                        </div>

                        <!-- Desktop Menu -->
                        <div class="hidden md:flex items-center space-x-4">
                            <!-- Theme Toggle -->
                            <div class="theme-toggle-wrapper mr-2">
                                <input type="checkbox" class="theme-checkbox" id="themeToggle">
                                <label for="themeToggle" class="theme-label">
                                    <span class="moon">🌙</span>
                                    <span class="sun">☀️</span>
                                    <span class="ball"></span>
                                </label>
                            </div>
                            <a href="landing.html"
                                class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Home</a>
                            <span id="adminInfo" class="text-gray-600"></span>
                            <button onclick="logout()"
                                class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">Logout</button>
                        </div>
                    </div>
                </div>

                <!-- Mobile Menu Dropdown -->
                <div id="adminMobileMenu" class="hidden md:hidden pb-4 transition-all duration-300 ease-in-out">
                    <div class="flex flex-col space-y-3 pt-2 border-t border-gray-200">
                        <div class="px-2 py-1">
                            <span id="mobileAdminInfo" class="text-gray-600 font-medium block mb-2"></span>
                        </div>
                        <!-- Mobile Theme Toggle -->
                        <div class="px-2 py-1 flex items-center justify-between">
                            <span class="text-gray-600 font-medium">Theme</span>
                            <div class="theme-toggle-wrapper">
                                <input type="checkbox" class="theme-checkbox" id="mobileThemeToggle">
                                <label for="mobileThemeToggle" class="theme-label">
                                    <span class="moon">🌙</span>
                                    <span class="sun">☀️</span>
                                    <span class="ball"></span>
                                </label>
                            </div>
                        </div>
                        <a href="landing.html"
                            class="block w-full text-left px-4 py-2 text-gray-700 font-semibold hover:bg-gray-50 hover:text-indigo-600 transition-colors">
                            Home
                        </a>

                        <button onclick="logout()"
                            class="w-full text-left bg-red-50 text-red-700 font-semibold px-4 py-3 rounded-lg hover:bg-red-100 transition-colors flex items-center">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Users Management -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                <div class="flex justify-between items-center mb-6" style="flex-direction: row !important;">
                    <h2 class="text-2xl font-bold text-gray-900">User Management</h2>
                    <div class="space-x-2">
                        <button onclick="refreshUsers()" title="Refresh Users"
                            class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Username</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Email</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Role</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Created</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Last Login</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Users will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- No users message -->
                <div id="noUsersMessage" class="text-center py-8 text-gray-500" style="display: none;">
                    No users found
                </div>
            </div>



            <!-- System Statistics -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Total Users</p>
                            <p id="totalUsers" class="text-2xl font-bold text-gray-900">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path>
                                <path fill-rule="evenodd"
                                    d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Active Users</p>
                            <p id="activeUsers" class="text-2xl font-bold text-gray-900">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Admins</p>
                            <p id="adminUsers" class="text-2xl font-bold text-gray-900">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer glass-footer mt-auto">
            <div class="app-footer-content">
                <div class="footer-left">
                    <span>&copy; 2025 SHM Ventures. All rights reserved.</span>
                </div>
                <div class="footer-links">
                    <a href="privacy-policy.html">Privacy Policy</a>
                    <a href="terms-of-service.html">Terms of Service</a>
                </div>
            </div>
        </footer>
    </div>


    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="utils.js"></script>
    <script src="admin.js"></script>
    <script src="api_call_tracker.js"></script>
    <script>
        // Theme Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const mobileThemeToggle = document.getElementById('mobileThemeToggle');

            // Check storage first, fallback to body attribute or default 'dark'
            const savedTheme = localStorage.getItem('theme');
            const initialTheme = savedTheme || document.body.getAttribute('data-theme') || 'dark';

            // Apply initial theme
            document.body.setAttribute('data-theme', initialTheme);
            document.documentElement.setAttribute('data-theme', initialTheme);

            // Handle table styles for admin page specifically if needed
            // But CSS overrides should handle it now

            const updateToggleState = (isDark) => {
                if (themeToggle) themeToggle.checked = isDark;
                if (mobileThemeToggle) mobileThemeToggle.checked = isDark;
            };

            updateToggleState(initialTheme === 'dark');

            const handleThemeChange = (e) => {
                const newTheme = e.target.checked ? 'dark' : 'light';
                document.body.setAttribute('data-theme', newTheme);
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateToggleState(newTheme === 'dark');
            };

            if (themeToggle) themeToggle.addEventListener('change', handleThemeChange);
            if (mobileThemeToggle) mobileThemeToggle.addEventListener('change', handleThemeChange);
        });
    </script>
</body>

</html>
