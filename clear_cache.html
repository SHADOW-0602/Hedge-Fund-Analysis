<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache & Load New Features</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <h1>Cache Cleared - New Features Loading</h1>
    <p>This page forces cache clearing. Click the button below to go to the main app with fresh files.</p>
    
    <button onclick="clearAndRedirect()" style="padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Load Main App with New Features
    </button>
    
    <script>
        // Clear all cached data
        if (typeof Storage !== "undefined") {
            localStorage.clear();
            sessionStorage.clear();
        }
        
        function clearAndRedirect() {
            // Force reload with cache bypass
            window.location.href = '/app?v=' + Date.now() + '&nocache=true';
        }
        
        // Auto redirect after 3 seconds
        setTimeout(() => {
            clearAndRedirect();
        }, 3000);
    </script>
</body>
</html>
